<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <span class="logo">◆</span>
    <span class="title">Communicator</span>
    <button id="tab-settings-btn" class="gear" title="Settings">⚙</button>
  </header>

  <!-- Capture --------------------------------------------------------------- -->
  <section class="panel active" data-panel="capture">
    <label class="lbl" for="friend-select">Friend</label>
    <select id="friend-select" class="in"></select>

    <label class="lbl" for="cap-input">Note</label>
    <textarea id="cap-input" class="in area" rows="5"
      placeholder="Selected text, a link, or anything worth remembering about them…"></textarea>
    <button id="cap-send" class="btn">Save note</button>

    <div class="or"><span>or</span></div>

    <label class="lbl">Attach a file</label>
    <div id="drop-zone" class="dropzone">
      Drop a file here, or <label class="filelink">choose one<input id="file-input" type="file" hidden /></label>
    </div>

    <p id="cap-status" class="status"></p>
  </section>

  <!-- Settings -------------------------------------------------------------- -->
  <section class="panel" data-panel="settings">
    <label class="lbl">Communicator API base</label>
    <input id="cfg-api" class="in" type="text" placeholder="https://communicator.work/api" />
    <button id="cfg-save" class="btn ghost">Save settings</button>
    <p id="settings-status" class="status"></p>

    <hr class="sep" />
    <button id="back-btn" class="btn ghost">← Back to capture</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
