<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <span class="logo">◆</span>
    <span class="title">Send to Learn</span>
    <button id="tab-settings-btn" class="gear" title="Settings">⚙</button>
  </header>

  <!-- Capture --------------------------------------------------------------- -->
  <section class="panel active" data-panel="capture">
    <!-- One-click smart capture of the current tab -->
    <button id="cap-page" class="btn">📄 Capture this page</button>
    <p id="cap-page-hint" class="hint">Grabs this tab: scrape an article, download a YouTube video or PDF — the agent takes over if that fails.</p>

    <div class="or"><span>or</span></div>

    <label class="lbl" for="cap-input">Paste text / a link, or drop a file</label>
    <textarea id="cap-input" class="in area" rows="5"
      placeholder="Paste anything — notes, an article link, a YouTube video, a PDF link… or drop a PDF / audio / video file here."></textarea>
    <p id="cap-hint" class="hint"></p>

    <button id="cap-send" class="btn ghost">Add to Learn queue</button>
    <p id="cap-status" class="status"></p>

    <!-- Agent activity: what the escalation agent is doing when an extraction fails -->
    <details id="agent-panel" class="agent" hidden>
      <summary>🤖 Agent activity <span id="agent-badge" class="agent-badge"></span></summary>
      <ul id="agent-feed" class="agent-feed"></ul>
    </details>
  </section>

  <!-- Settings -------------------------------------------------------------- -->
  <section class="panel" data-panel="settings">
    <label class="lbl">ObsidianOptimizer API base</label>
    <input id="cfg-obsidian" class="in" type="text" placeholder="https://obsidianoptimizer.uk/api" />
    <label class="lbl">Agent WS token (optional — enables the escalation agent)</label>
    <input id="cfg-agent-token" class="in" type="password" placeholder="AGENT_WS_TOKEN" autocomplete="off" />
    <button id="cfg-save" class="btn ghost">Save settings</button>

    <hr class="sep" />

    <p class="lbl" id="auth-line">Sign in to ObsidianOptimizer</p>
    <input id="login-user" class="in" type="text" placeholder="Username" autocomplete="username" />
    <input id="login-pass" class="in" type="password" placeholder="Password" autocomplete="current-password" />
    <label class="remember"><input id="login-remember" type="checkbox" checked /> Remember me (stay signed in)</label>
    <button id="login-btn" class="btn">Sign in</button>
    <p id="settings-status" class="status"></p>

    <button id="back-btn" class="btn ghost">← Back to capture</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
